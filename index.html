<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rigol Web Panel</title>
<style>
  :root {
    --bg: #101218; --panel: #181b24; --line: #2a2f3d; --text: #d8dbe3; --muted: #8a90a0;
    --ch1: #f2e632; --ch2: #4cc9f0; --trig: #ff8a3d; --accent: #6c8cff; --danger: #e5566b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  header { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .idn { color: var(--muted); font-size: 12px; }
  header .status { margin-left: auto; font-variant-numeric: tabular-nums; font-size: 13px; }
  .badge { padding: 2px 8px; border-radius: 10px; background: var(--line); }
  .badge.stop { background: var(--danger); color: #fff; }
  main { display: grid; grid-template-columns: 1fr 420px; gap: 12px; padding: 12px; height: calc(100vh - 46px); }
  main > section { min-width: 0; display: flex; flex-direction: column; }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; height: auto; } }
  .screen { background: #05060a; border: 1px solid var(--line); border-radius: 8px; padding: 6px; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  /* the 3:2 screen is sized by script (fitScreen) to the room the box gets, so the measurement chips
     below can take as many lines as they need without a page scroll */
  canvas { display: block; }
  .meas { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 8px; font-variant-numeric: tabular-nums; }
  .meas .grp { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 6px; border: 1px solid var(--line); border-left-width: 3px; min-height: 34px; align-content: flex-start; }
  .meas .c1 { border-left-color: var(--ch1); } .meas .c2 { border-left-color: var(--ch2); }
  .chip { background: var(--panel); border-radius: 4px; padding: 2px 8px; white-space: nowrap; font-size: 13px; }
  .chip b { font-weight: 600; margin-left: 6px; }
  .chip.c1 b { color: var(--ch1); } .chip.c2 b { color: var(--ch2); }
  .chip.off { color: var(--muted); }
  /* two columns: CH1 | CH2, then related pairs below; .wide blocks span both */
  aside { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-content: start; overflow-y: auto; overflow-x: hidden; min-height: 0; font-size: 13px; padding-right: 4px; }
  aside .wide { grid-column: 1 / -1; }
  /* fieldsets default to min-width: min-content, which pushed the controls past the panel edge */
  fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px 8px; margin: 0; background: var(--panel); min-width: 0; }
  legend { padding: 0 6px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  legend.c1 { color: var(--ch1); } legend.c2 { color: var(--ch2); }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
  .row label { width: 54px; flex: none; color: var(--muted); font-size: 12px; }
  .muted { color: var(--muted); font-size: 12px; }
  select, input[type=number], input[type=text] { flex: 1; min-width: 0; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; font: inherit; }
  button { background: var(--line); color: var(--text); border: 0; border-radius: 5px; padding: 6px 10px; font: inherit; cursor: pointer; }
  button:hover { background: #363c4e; }
  button.primary { background: var(--accent); color: #fff; }
  button.small { padding: 4px 8px; }
  /* green = "this is in effect": Remote while the page drives the scope, Auto until a setting changes */
  button.lit { background: #2f9e5b; color: #fff; }
  button.lit:hover { background: #38b56a; }
  .buttons { display: flex; flex-wrap: wrap; gap: 6px; }
  .buttons.one-line { flex-wrap: nowrap; gap: 4px; }
  .buttons.one-line button { flex: 1 1 auto; padding: 6px 4px; white-space: nowrap; }
  .err { color: var(--danger); font-size: 12px; min-height: 1em; }
  /* Basic / Advanced: advanced rows and blocks are hidden unless body.adv */
  body:not(.adv) .adv-only { display: none !important; }
  header #advBtn { padding: 3px 10px; font-size: 12px; }
  .checks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px 8px; margin-top: 4px; font-size: 12px; }
  .checks label { display: flex; gap: 4px; align-items: center; color: var(--text); white-space: nowrap; }
  /* one fixed-height line each, so changing numbers never move the controls */
  .readline { height: 18px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .readout { font-variant-numeric: tabular-nums; font-size: 12px; margin-top: 4px; color: var(--text); white-space: pre-line; }
  canvas.dragging { cursor: grabbing; }
  .row.place { gap: 3px; }
  .row.place button { flex: 1 1 auto; min-width: 0; padding: 4px 1px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Rigol Web Panel</h1>
  <span class="idn" id="idn">connecting...</span>
  <span class="status"><button id="advBtn" title="Show the advanced settings">Advanced</button>
    <span class="badge" id="tstat">-</span> <span id="fps"></span></span>
</header>
<main>
  <section>
    <div class="screen"><canvas id="scr" width="1200" height="800"></canvas></div>
    <div class="meas">
      <div class="grp c1" id="m1"></div>
      <div class="grp c2" id="m2"></div>
    </div>
    <div class="err" id="err"></div>
  </section>
  <aside>
    <fieldset class="wide">
      <legend>Run control</legend>
      <div class="buttons one-line">
        <button class="primary" data-act="run">Run</button>
        <button data-act="stop">Stop</button>
        <button data-act="single">Single</button>
        <button data-act="force">Force trig</button>
        <button id="autoBtn" title="Let the scope pick the settings; stays green until something is changed">Auto</button>
        <button id="panelBtn" title="Green: the page drives the scope. Grey: the scope's own buttons are free (default)">Remote</button>
      </div>
    </fieldset>
    <fieldset id="ch1"><legend class="c1">Channel 1</legend></fieldset>
    <fieldset id="ch2"><legend class="c2">Channel 2</legend></fieldset>
    <fieldset>
      <legend>Horizontal</legend>
      <div class="row"><label>Time/div</label><select id="time.scale"></select></div>
      <div class="row"><label>Delay, s</label><input type="number" id="time.offset" step="any">
        <button class="small" data-zero="time.offset">0</button></div>
      <div class="row adv-only"><label>Format</label><select id="time.format">
        <option value="YT">Y-T</option><option value="XY">X-Y</option><option value="SCANNING">Roll</option></select></div>
    </fieldset>
    <fieldset>
      <legend>Trigger</legend>
      <div class="row"><label>Source</label><select id="trig.source">
        <option value="CHAN1">CH1</option><option value="CHAN2">CH2</option><option value="EXT">EXT</option></select></div>
      <div class="row"><label>Slope</label><select id="trig.slope">
        <option value="POS">Rising</option><option value="NEG">Falling</option></select></div>
      <div class="row"><label>Sweep</label><select id="trig.sweep">
        <option value="AUTO">Auto</option><option value="NORM">Normal</option><option value="SING">Single</option></select></div>
      <div class="row"><label>Level, V</label><input type="number" id="trig.level" step="any">
        <button class="small" data-act="level50">50%</button></div>
      <div class="row adv-only"><label>Coupling</label><select id="trig.coupling">
        <option value="DC">DC</option><option value="AC">AC</option><option value="HF">HF reject</option><option value="LF">LF reject</option></select></div>
      <div class="row adv-only"><label>Holdoff, s</label><input type="number" id="trig.holdoff" step="any" min="0.0000005" max="1.5"></div>
      <div class="row adv-only"><label>Sens, div</label><input type="number" id="trig.sensitivity" step="0.1" min="0.1" max="1"></div>
    </fieldset>
    <fieldset>
      <legend>Acquire</legend>
      <div class="row"><label>Mode</label><select id="acq.type">
        <option value="NORM">Normal</option><option value="AVER">Average</option><option value="PEAK">Peak detect</option></select></div>
      <div class="row adv-only"><label>Averages</label><select id="acq.averages">
        <option>2</option><option>4</option><option>8</option><option>16</option><option>32</option><option>64</option><option>128</option><option>256</option></select></div>
      <div class="row adv-only"><label>Memory</label><select id="acq.memdepth">
        <option value="NORMAL">Normal</option><option value="LONG">Long</option></select></div>
    </fieldset>
    <fieldset>
      <legend>Save</legend>
      <div class="buttons"><button id="savePng">PNG</button><button id="saveCsv">CSV</button></div>
    </fieldset>
    <fieldset class="wide adv-only">
      <legend>Deep capture &amp; FFT</legend>
      <div class="row"><label>FFT</label>
        <select id="fftCh" style="flex: none; width: 80px"><option value="off">Off</option><option value="1">CH1</option><option value="2">CH2</option></select>
        <span style="flex: 1"></span>
        <button class="small" id="deepBtn" title="Stop the scope and read its whole memory: 8192 points per channel">Capture</button>
        <button class="small" id="liveBtn" title="Back to the live screen (starts the scope)">Live</button></div>
      <div class="readline muted" id="deepOut"></div>
      <div class="readline muted" id="fftOut"></div>
    </fieldset>
    <fieldset class="wide adv-only">
      <legend>Measure</legend>
      <div class="checks" id="measChecks"></div>
    </fieldset>
    <fieldset class="wide adv-only">
      <legend>Cursors</legend>
      <div class="row"><label>Show</label><select id="curMode">
        <option value="off">Off</option><option value="t">Time</option><option value="v">Voltage</option><option value="tv">Both</option></select>
        <label>Channel</label><select id="curCh"><option value="1">CH1</option><option value="2">CH2</option></select></div>
      <div class="readout" id="curOut">Drag the dashed lines on the screen</div>
    </fieldset>
    <fieldset class="wide">
      <legend>Presets</legend>
      <div class="row"><select id="presetList"></select>
        <button class="small" id="presetLoad">Load</button><button class="small" id="presetDel">Delete</button></div>
      <div class="row"><input type="text" id="presetName" placeholder="Preset name">
        <button class="small" id="presetSave">Save</button></div>
      <div class="row"><span id="presetMsg" class="muted"></span></div>
    </fieldset>
  </aside>
</main>
<script>
const VDIV = [0.002, 0.005, 0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1, 2, 5, 10];
const TDIV = [];
for (let e = -9; e <= 1; e++) for (const m of [1, 2, 5]) { const v = m * 10 ** e; if (v >= 2e-9 && v <= 50) TDIV.push(+v.toPrecision(3)); }
const COLORS = { 1: '#f2e632', 2: '#4cc9f0' };
const GRID_X = 12, GRID_Y = 8;
const cv = document.getElementById('scr'), g = cv.getContext('2d');
let st = {}, last = null, frames = 0, fpsT = performance.now();

const fmt = (v, unit) => {
  if (v == null) return '-';
  const a = Math.abs(v);
  const [k, p] = a >= 1e6 ? [1e-6, 'M'] : a >= 1e3 ? [1e-3, 'k'] : a >= 1 || a === 0 ? [1, ''] : a >= 1e-3 ? [1e3, 'm'] : a >= 1e-6 ? [1e6, 'µ'] : [1e9, 'n'];
  return +(v * k).toPrecision(4) + ' ' + p + unit;
};
const api = async (path, body) => {
  const r = await fetch(path, body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) { const e = new Error(r.status === 503 ? 'Scope offline - waiting for it to come back' : path + ': ' + r.status); e.status = r.status; throw e; }
  return r.json();
};
const showErr = e => { document.getElementById('err').textContent = e ? String(e.message || e) : ''; };

// channel panels are identical, build them from one template
for (const n of [1, 2]) {
  document.getElementById('ch' + n).insertAdjacentHTML('beforeend', `
    <div class="row"><label>Show</label><select id="ch${n}.display"><option value="true">On</option><option value="false">Off</option></select></div>
    <div class="row"><label>Coupling</label><select id="ch${n}.coupling"><option>DC</option><option>AC</option><option>GND</option></select></div>
    <div class="row"><label>Volts/div</label><select id="ch${n}.scale"></select></div>
    <div class="row"><label>Offset, V</label><input type="number" id="ch${n}.offset" step="any">
      <button class="small" data-zero="ch${n}.offset">0</button></div>
    <div class="row place"><label>Position</label>
      <button class="small" data-place="${n}:0" title="Middle of the signal to the screen centre">Center</button>
      <button class="small" data-place="${n}:2" title="Middle of the signal to the centre of the upper half">Up</button>
      <button class="small" data-place="${n}:-2" title="Middle of the signal to the centre of the lower half">Down</button></div>
    <div class="row"><label>Probe</label><select id="ch${n}.probe"><option value="1">1x</option><option value="10">10x</option><option value="100">100x</option></select></div>
    <div class="row adv-only"><label>Invert</label><select id="ch${n}.invert"><option value="false">Off</option><option value="true">On</option></select></div>
    <div class="row adv-only"><label>BW 20M</label><select id="ch${n}.bwlimit"><option value="false">Off</option><option value="true">On</option></select></div>
    <div class="row adv-only"><label>Vernier</label><select id="ch${n}.vernier"><option value="false">Off</option><option value="true">On</option></select></div>
    <div class="row adv-only"><label>Fine V/div</label><input type="number" id="fine${n}" step="any" title="Exact volts/div; turn Vernier on for values between the 1-2-5 steps"></div>`);
}
for (const n of [1, 2]) for (const v of VDIV) document.getElementById(`ch${n}.scale`).add(new Option(fmt(v, 'V'), v));
for (const v of TDIV) document.getElementById('time.scale').add(new Option(fmt(v, 's'), v));

// the scope answers with long words ("POSITIVE", "Peak Detect"); match them to the short option values
function setControl(name, value) {
  const el = document.getElementById(name);
  if (!el || !['SELECT', 'INPUT'].includes(el.tagName) || value == null || document.activeElement === el) return;
  if (el.tagName === 'INPUT') { el.value = +(+value).toPrecision(4); return; }
  const s = String(value).toUpperCase().replace(/[^A-Z0-9.]/g, '');
  let best = null;
  for (const o of el.options) {
    const ov = o.value.toUpperCase();
    if (typeof value === 'number' ? Math.abs(+o.value - value) < 1e-12 * Math.max(1, Math.abs(value)) || Math.abs(+o.value / value - 1) < 1e-3 : s === ov || s.startsWith(ov) || s.replace('CH', 'CHAN') === ov) { best = o; break; }
  }
  if (best) el.value = best.value;
}
// Auto stays lit while the settings are still the ones the scope picked
let autoSnap = null;
const settingsOf = s => JSON.stringify(Object.entries(s).filter(([k]) => k !== 'idn' && k !== 'trig.status').sort());
function autoOff() { autoSnap = null; document.getElementById('autoBtn').classList.remove('lit'); }

async function loadState(full = true) {
  st = { ...st, ...await api('/api/state?full=' + (full ? 1 : 0)) };
  document.getElementById('idn').textContent = st.idn;
  for (const [k, v] of Object.entries(st)) setControl(k, v);
  for (const n of [1, 2]) setControl('fine' + n, st[`ch${n}.scale`]);
  offsetSteps();
  if (autoSnap && settingsOf(st) !== autoSnap) autoOff();      // changed on the scope itself
}
document.getElementById('autoBtn').onclick = async () => {
  const b = document.getElementById('autoBtn');
  try {
    autoOff(); b.textContent = 'Auto...';
    await api('/api/action/auto', {});
    await new Promise(r => setTimeout(r, 4000));   // the scope needs a few seconds to settle
    await loadState();
    autoSnap = settingsOf(st); b.classList.add('lit'); showErr();
  } catch (e) { showErr(e); }
  b.textContent = 'Auto';
};
document.querySelectorAll('aside select[id*="."], aside input[id*="."]').forEach(el => el.addEventListener('change', async () => {
  try {
    let value = el.value;
    if (value === 'true' || value === 'false') value = value === 'true';
    const r = await api('/api/set', { name: el.id, value });
    Object.assign(st, r); setControl(el.id, r[el.id]); showErr(); autoOff();
  } catch (e) { showErr(e); }
}));
document.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', async () => {
  try { await api('/api/action/' + b.dataset.act, {}); setTimeout(loadState, 300); showErr(); } catch (e) { showErr(e); }
}));
document.querySelectorAll('[data-zero]').forEach(b => b.addEventListener('click', () => {
  const el = document.getElementById(b.dataset.zero); el.value = 0; el.dispatchEvent(new Event('change'));
}));

function draw(w) {
  if (w && fftOn()) { drawFFT(w); return; }
  const W = cv.width, H = cv.height, dx = W / GRID_X, dy = H / GRID_Y;
  g.fillStyle = '#05060a'; g.fillRect(0, 0, W, H);
  g.strokeStyle = '#1f2533'; g.lineWidth = 1;
  for (let i = 0; i <= GRID_X; i++) { g.beginPath(); g.moveTo(i * dx, 0); g.lineTo(i * dx, H); g.stroke(); }
  for (let i = 0; i <= GRID_Y; i++) { g.beginPath(); g.moveTo(0, i * dy); g.lineTo(W, i * dy); g.stroke(); }
  g.strokeStyle = '#323a4e'; g.beginPath(); g.moveTo(W / 2, 0); g.lineTo(W / 2, H); g.moveTo(0, H / 2); g.lineTo(W, H / 2); g.stroke();
  if (!w) return;
  const toY = (v, c) => H / 2 - (v + c.offset) / c.scale * dy;
  if (/^X/.test(String(st['time.format'] || '').toUpperCase()) && w.ch[1] && w.ch[2]) {   // X-Y: CH1 across, CH2 up
    const a = w.ch[1], b = w.ch[2];
    g.strokeStyle = '#7ee0a8'; g.lineWidth = 2; g.beginPath();
    a.v.forEach((v, i) => { const x = W / 2 + (v + a.offset) / a.scale * dx, y = toY(b.v[i], b); i ? g.lineTo(x, y) : g.moveTo(x, y); });
    g.stroke();
    g.font = '18px system-ui'; g.fillStyle = '#d8dbe3';
    g.fillText(`X: CH1 ${fmt(a.scale, 'V')}/div   Y: CH2 ${fmt(b.scale, 'V')}/div`, 24, 26);
    return;
  }
  for (const [n, c] of Object.entries(w.ch)) {
    g.strokeStyle = COLORS[n]; g.lineWidth = 2; g.beginPath();
    c.v.forEach((v, i) => { const x = i * W / c.v.length, y = toY(v, c); i ? g.lineTo(x, y) : g.moveTo(x, y); });
    g.stroke();
    // ground marker on the left edge, pinned to the edge when the ground is off screen
    const gy = Math.min(H - 10, Math.max(10, toY(0, c))); g.fillStyle = COLORS[n];
    g.beginPath(); g.moveTo(0, gy - 8); g.lineTo(14, gy); g.lineTo(0, gy + 8); g.fill();
    g.font = 'bold 13px system-ui'; g.fillStyle = '#05060a'; g.fillText(n, 2, gy + 5);
  }
  // trigger level marker on the right edge, on the trigger source's scale
  const src = String(st['trig.source'] || '').replace(/\D/g, ''), tc = w.ch[src];
  if (tc && st['trig.level'] != null) {
    const ty = toY(st['trig.level'], tc); g.fillStyle = '#ff8a3d';
    g.beginPath(); g.moveTo(W, ty - 8); g.lineTo(W - 14, ty); g.lineTo(W, ty + 8); g.fill();
  }
  // trigger time marker on top
  const tx = W / 2 - w.toffset / w.tscale * dx;
  if (tx >= 0 && tx <= W) { g.fillStyle = '#ff8a3d'; g.beginPath(); g.moveTo(tx - 8, 0); g.lineTo(tx + 8, 0); g.lineTo(tx, 12); g.fill(); }
  // scale labels in the top corners, clear of the ground markers
  g.font = '18px system-ui'; let x = 24;
  for (const [n, c] of Object.entries(w.ch)) { g.fillStyle = COLORS[n]; g.fillText(`CH${n} ${fmt(c.scale, 'V')}/div`, x, 26); x += 170; }
  g.fillStyle = '#d8dbe3'; g.textAlign = 'right'; g.fillText(`${fmt(w.tscale, 's')}/div`, W - 24, 26); g.textAlign = 'left';
  drawCursors(w);
}

// "Remote" toggle: the scope locks its buttons on every remote command, so while the user works
// on the scope itself the page must stop talking to it, not just send one unlock.
let panelFree = true;          // start in Local: never grab the scope until asked
const idle = () => new Promise(r => setTimeout(r, 300));
document.getElementById('panelBtn').onclick = async () => {
  panelFree = !panelFree;
  document.getElementById('panelBtn').classList.toggle('lit', !panelFree);
  document.getElementById('tstat').textContent = panelFree ? 'LOCAL' : '-';
  if (panelFree) { await new Promise(r => setTimeout(r, 1200)); await api('/api/action/local', {}).catch(showErr); drawLocal(); }
  else loadState().catch(showErr);           // pick up whatever was changed on the scope meanwhile
};

let offline = false, connId = null;
function setLocal() {
  panelFree = true;
  document.getElementById('panelBtn').classList.remove('lit');
  api('/api/action/local', {}).catch(() => {});
  drawLocal();
}
async function waveLoop() {
  for (;;) {
    if (panelFree || deep) { await idle(); continue; }      // deep capture: the scope is stopped, show the snapshot
    try {
      const w = await api('/api/wave');
      if (connId !== null && w.conn !== connId) {         // the scope came back after a power cycle:
        connId = w.conn; setLocal(); continue;            // hand control back to its own buttons
      }
      connId = w.conn;
      if (markerDrag) continue;                           // keep the dragged preview on screen
      last = w;
      draw(last);
      const b = document.getElementById('tstat'); b.textContent = last.status; b.classList.toggle('stop', /STOP/i.test(last.status));
      frames++; showErr();
      if (offline) { offline = false; loadState().catch(() => {}); }   // back: settings may have changed
    } catch (e) {
      showErr(e);
      if (e.status === 503) { offline = true; document.getElementById('tstat').textContent = 'OFFLINE'; }
      await new Promise(r => setTimeout(r, 1000));
    }
    const now = performance.now();
    if (now - fpsT > 2000) { document.getElementById('fps').textContent = (frames * 1000 / (now - fpsT)).toFixed(1) + ' fps'; frames = 0; fpsT = now; }
  }
}
let lastMeas = null;
// the scope reports duty cycle, overshoot and preshoot as fractions, shown here in percent
const measText = (k, x) => x == null ? '-' : MEAS[k][1] === '%' ? +(x * 100).toPrecision(3) + ' %' : fmt(x, MEAS[k][1]);

// largest 3:2 canvas that fits the screen box (which gets whatever height the chips leave)
const screenBox = document.querySelector('.screen');
function fitScreen() {
  const w = screenBox.clientWidth - 14, h = screenBox.clientHeight - 14;
  const narrow = window.innerWidth <= 1100;                   // stacked layout: fit by width only

async function measureLoop() {
  for (;;) {
    if (panelFree) { await idle(); continue; }
    try {
      const keys = measKeys();
      const m = await api('/api/measure?keys=' + keys.join(','));
      lastMeas = { keys, m };
      for (const n of [1, 2]) {
        const v = m[n];
        document.getElementById('m' + n).innerHTML = !v ? '<span class="chip off">off</span>' :
          keys.map(k => `<span class="chip c${n}">${MEAS[k][0]}<b>${measText(k, v[k])}</b></span>`).join('');

}

function drawCursors(w) {

function canvasPos(e) {
  const r = cv.getBoundingClientRect();

// ---- position by mouse: drag a channel's ground marker (offset) or the trigger marker (level) ----
// The scope moves in 1/25 of a division, so that is the step here too.
let markerDrag = null;
const step25 = scale => scale / 25;
const snap = (v, s) => Math.round(v / s) * s;
function markerAt(fx, fy) {
  if (!last || panelFree || deep || fftOn()) return null;
  const W = cv.width, H = cv.height, dy = H / GRID_Y, x = fx * W, y = fy * H;
  const toY = (v, c) => H / 2 - (v + c.offset) / c.scale * dy;
  if (x < 40) for (const [n, c] of Object.entries(last.ch)) {
    if (Math.abs(Math.min(H - 10, Math.max(10, toY(0, c))) - y) < 18) return { type: 'off', n };
  }
  const src = String(st['trig.source'] || '').replace(/\D/g, ''), tc = last.ch[src];
  if (x > W - 40 && tc && st['trig.level'] != null && Math.abs(toY(st['trig.level'], tc) - y) < 18) return { type: 'lev', n: src };
  return null;
}
cv.addEventListener('mousedown', e => {
  const r = cv.getBoundingClientRect(), m = markerAt((e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height);
  if (!m) return;
  markerDrag = m; cv.classList.add('dragging');
  e.preventDefault(); e.stopImmediatePropagation();          // don't let the cursors grab it too
}, true);
window.addEventListener('mousemove', e => {
  if (!markerDrag) return;
  const r = cv.getBoundingClientRect(), H = cv.height, dy = H / GRID_Y;
  const y = (e.clientY - r.top) / r.height * H, c = last.ch[markerDrag.n];
  const atY = (H / 2 - y) / dy * c.scale;                    // volts the pointer is at, before the offset

  else { st['trig.level'] = snap(atY - c.offset, step25(c.scale)); markerDrag.value = st['trig.level']; }
  draw(last);
});
window.addEventListener('mouseup', async () => {
  const m = markerDrag; if (!m) return;

  if (m.value == null) return;
  await setSetting(m.type === 'off' ? `ch${m.n}.offset` : 'trig.level', +m.value.toFixed(6));
});

// Center / Up / Down: put the middle of the signal (between its max and min) at the screen centre,

// ---- deep capture: the scope's whole memory (8192 points per channel), zoom with the wheel, pan by dragging ----
let deep = null;                  // { ch: { n: { v, scale, offset } }, dt, n, toffset }
const view = { c: 0, span: 0 };   // shown window: centre time and width, seconds
const deepMsg = t => { document.getElementById('deepOut').textContent = t; };

document.getElementById('deepBtn').onclick = async () => {
  if (panelFree) { showErr(new Error('Press Remote first')); return; }
  deepMsg('reading...');
  try {
    const r = await api('/api/deep', {});
    const ch = {};
    let dt = 0, n = 0;
    for (const [k, c] of Object.entries(r.ch)) {
      const bytes = Uint8Array.from(atob(c.raw), x => x.charCodeAt(0));
      const v = new Float32Array(bytes.length);
      for (let i = 0; i < bytes.length; i++) v[i] = (240 - bytes[i]) * (c.scale / 25) - (c.offset + c.scale * 4.6);
      ch[k] = { v, scale: c.scale, offset: c.offset };
      dt = 1 / c.rate; n = bytes.length;
    }
    if (!n) { deepMsg('no channel on'); return; }
    deep = { ch, dt, n, toffset: r.toffset };
    view.c = r.toffset; view.span = r.tscale * GRID_X;      // start with what the screen showed
    document.getElementById('tstat').textContent = 'DEEP';
    renderDeep(); showErr();
  } catch (e) { showErr(e); deepMsg(''); }
};
document.getElementById('liveBtn').onclick = async () => {

};

// time of sample i: t = 0 sits at index n/2 - 1 when the delay is zero
const deepT = i => (i - (deep.n / 2 - 1)) * deep.dt + deep.toffset;
const deepI = t => (t - deep.toffset) / deep.dt + deep.n / 2 - 1;

// a screen-shaped frame of the visible window: min and max per pixel column, so short spikes stay visible
function deepFrame() {
  const cols = 600, w = { tscale: view.span / GRID_X, toffset: view.c, ch: {}, dt: deep.dt, deep: true };
  for (const [k, c] of Object.entries(deep.ch)) {
    const out = new Array(cols * 2);
    for (let col = 0; col < cols; col++) {
      const t0 = view.c + (col / cols - 0.5) * view.span, t1 = t0 + view.span / cols;
      let a = Math.max(0, Math.floor(deepI(t0))), b = Math.min(deep.n - 1, Math.ceil(deepI(t1)));
      if (b < a) { out[col * 2] = out[col * 2 + 1] = NaN; continue; }
      let lo = Infinity, hi = -Infinity;
      for (let i = a; i <= b; i++) { const x = c.v[i]; if (x < lo) lo = x; if (x > hi) hi = x; }
      out[col * 2] = lo; out[col * 2 + 1] = hi;
    }
    w.ch[k] = { scale: c.scale, offset: c.offset, v: out };
  }
  return w;
}
function renderDeep() {
  if (!deep) return;
  const full = deep.n * deep.dt;
  view.span = Math.min(full, Math.max(deep.dt * 20, view.span));
  last = deepFrame(); draw(last);
  deepMsg(`${deep.n} pts, ${fmt(1 / deep.dt, 'Sa/s')}, view ${fmt(view.span, 's')} of ${fmt(full, 's')}`);
}
cv.addEventListener('wheel', e => {
  if (!deep) return;
  e.preventDefault();
  const r = cv.getBoundingClientRect(), f = (e.clientX - r.left) / r.width;
  const tAt = view.c + (f - 0.5) * view.span, k = e.deltaY > 0 ? 1.25 : 0.8;
  view.span *= k; view.c = tAt - (f - 0.5) * view.span;          // keep the time under the pointer in place
  renderDeep();
}, { passive: false });
let pan = null;
cv.addEventListener('mousedown', e => {

  pan = { x: e.clientX, c: view.c }; cv.classList.add('dragging');
});
window.addEventListener('mousemove', e => {

// ---- FFT of what is on screen (live 600 points, or the visible part of a deep capture), Hann window ----
const fftOn = () => document.getElementById('fftCh').value !== 'off' && document.body.classList.contains('adv');
function fftMag(x) {
  // radix-2, in place; x.length is a power of two
  const n = x.length, re = Float64Array.from(x), im = new Float64Array(n);
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { [re[i], re[j]] = [re[j], re[i]]; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const a = -2 * Math.PI / len, wr = Math.cos(a), wi = Math.sin(a);
    for (let i = 0; i < n; i += len) {
      let cr = 1, ci = 0;
      for (let k = 0; k < len / 2; k++) {
        const ur = re[i + k], ui = im[i + k];
        const vr = re[i + k + len / 2] * cr - im[i + k + len / 2] * ci, vi = re[i + k + len / 2] * ci + im[i + k + len / 2] * cr;
        re[i + k] = ur + vr; im[i + k] = ui + vi; re[i + k + len / 2] = ur - vr; im[i + k + len / 2] = ui - vi;
        [cr, ci] = [cr * wr - ci * wi, cr * wi + ci * wr];
      }
    }
  }
  const mag = new Float64Array(n / 2);
  for (let i = 0; i < n / 2; i++) mag[i] = Math.hypot(re[i], im[i]);
  return mag;
}
function fftSamples(w) {
  const n = document.getElementById('fftCh').value;
  if (deep) {                     // the real samples of the visible window, not the min/max frame
    const c = deep.ch[n]; if (!c) return null;
    const a = Math.max(0, Math.floor(deepI(view.c - view.span / 2))), b = Math.min(deep.n, Math.ceil(deepI(view.c + view.span / 2)));
    return { n, x: c.v.slice(a, b), fs: 1 / deep.dt };
  }
  const c = w.ch[n]; if (!c) return null;
  return { n, x: c.v, fs: c.v.length / (GRID_X * w.tscale) };
}
function drawFFT(w) {
  // plot area inset from the canvas edges: dB labels go to the left of it, Hz labels below

  const s = fftSamples(w);
  g.fillStyle = '#05060a'; g.fillRect(0, 0, W, H);
  g.strokeStyle = '#1f2533'; g.lineWidth = 1;
  for (let i = 0; i <= 10; i++) { g.beginPath(); g.moveTo(L + i * PW / 10, T); g.lineTo(L + i * PW / 10, T + PH); g.stroke(); }
  for (let i = 0; i <= 8; i++) { g.beginPath(); g.moveTo(L, T + i * PH / 8); g.lineTo(L + PW, T + i * PH / 8); g.stroke(); }
  if (!s || s.x.length < 64) { document.getElementById('fftOut').textContent = 'not enough data'; return; }
  let N = 1; while (N * 2 <= s.x.length) N *= 2;
  const x = s.x.slice(0, N), mean = x.reduce((p, v) => p + v, 0) / N;
  const win = i => 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (N - 1));
  const mag = fftMag(Array.from(x, (v, i) => (v - mean) * win(i)));
  // volts rms per bin: 2/N for one-sided, /0.5 for the Hann window's coherent gain, /sqrt2 for rms
  const vrms = Array.from(mag, m => m * 2 / N / 0.5 / Math.SQRT2);
  const db = vrms.map(v => 20 * Math.log10(Math.max(v, 1e-9)));        // dBV
  const fNyq = s.fs / 2, df = s.fs / N, TOP = 10, DB_DIV = 10;        // +10 dBV at the top, 10 dB/div
  const yOf = d => T + Math.min(PH, Math.max(0, (TOP - d) / (DB_DIV * 8) * PH));
  g.save(); g.beginPath(); g.rect(L, T, PW, PH); g.clip();
  g.strokeStyle = COLORS[s.n]; g.lineWidth = 2; g.beginPath();
  db.forEach((d, i) => { const px = L + i / db.length * PW, py = yOf(d); i ? g.lineTo(px, py) : g.moveTo(px, py); });
  g.stroke(); g.restore();
  let pk = 1; for (let i = 2; i < vrms.length; i++) if (vrms[i] > vrms[pk]) pk = i;
  g.font = '18px system-ui'; g.fillStyle = COLORS[s.n]; g.textBaseline = 'alphabetic';
  g.fillText(`FFT CH${s.n}   ${DB_DIV} dB/div   ${fmt(fNyq / 10, 'Hz')}/div   resolution ${fmt(df, 'Hz')}`, L, 28);
  g.font = '15px system-ui'; g.fillStyle = '#8a90a0';
  g.textAlign = 'right';
  for (let i = 0; i <= 8; i++) g.fillText(`${TOP - i * DB_DIV} dBV`, L - 8, T + i * PH / 8 + 5);
  g.textAlign = 'center';
  for (let i = 0; i <= 10; i += 2) g.fillText(fmt(fNyq * i / 10, 'Hz'), L + i * PW / 10, T + PH + 24);
  g.textAlign = 'left';
  document.getElementById('fftOut').textContent =
    `peak ${fmt(pk * df, 'Hz')}  ${fmt(vrms[pk], 'V')} rms (${db[pk].toFixed(1)} dBV), ${N} points`;
}
document.getElementById('fftCh').addEventListener('change', () => {

// ---- presets: named snapshots of the control values, kept in this browser's localStorage ----
const PRESET_KEY = 'rigolweb.presets';
const SETTING_IDS = [...document.querySelectorAll('aside select[id*="."], aside input[id*="."]')].map(el => el.id);
const presetMsg = t => { document.getElementById('presetMsg').textContent = t; };
function readPresets() { try { return JSON.parse(localStorage.getItem(PRESET_KEY)) || {}; } catch (e) { return {}; } }
function writePresets(p) { try { localStorage.setItem(PRESET_KEY, JSON.stringify(p)); } catch (e) { presetMsg('cannot save: storage unavailable'); } }
function listPresets(select) {
  const sel = document.getElementById('presetList'), names = Object.keys(readPresets()).sort();
  sel.innerHTML = ''; names.forEach(n => sel.add(new Option(n, n)));
  if (select) sel.value = select;
}
document.getElementById('presetSave').onclick = async () => {
  const name = document.getElementById('presetName').value.trim() || document.getElementById('presetList').value;
  if (!name) { presetMsg('enter a name'); return; }
  try {
    await loadState();                        // catch front panel changes before taking the snapshot
    const snap = {};
    for (const id of SETTING_IDS) { const v = document.getElementById(id).value; snap[id] = v === 'true' ? true : v === 'false' ? false : v; }
    const p = readPresets(); p[name] = snap; writePresets(p);
    listPresets(name); document.getElementById('presetName').value = ''; presetMsg('saved');
  } catch (e) { showErr(e); }
};
document.getElementById('presetLoad').onclick = async () => {
  const name = document.getElementById('presetList').value, snap = readPresets()[name];
  if (!snap) return;
  presetMsg('applying...');
  autoOff();
  try { st = await api('/api/apply', snap); for (const [k, v] of Object.entries(st)) setControl(k, v); presetMsg('loaded ' + name); }
  catch (e) { showErr(e); presetMsg(''); }
};
document.getElementById('presetDel').onclick = () => {
  const name = document.getElementById('presetList').value;
  if (!name || !confirm(`Delete preset "${name}"?`)) return;
  const p = readPresets(); delete p[name]; writePresets(p); listPresets(); presetMsg('deleted');
};
listPresets();

function drawLocal() {
  draw(null);
  g.fillStyle = '#8a90a0'; g.font = '28px system-ui'; g.textAlign = 'center';
  g.fillText("Local: the scope's own buttons are active", cv.width / 2, cv.height / 2 - 20);
  g.fillText('Press Remote to drive it from here', cv.width / 2, cv.height / 2 + 24);
  g.textAlign = 'left';
  document.getElementById('tstat').textContent = 'LOCAL';
}
drawLocal();
waveLoop(); measureLoop();
// a full state read is ~20 queries (2+ s on this scope), so only now and then to catch front panel changes
setInterval(() => { if (!panelFree) loadState(false).catch(() => {}); }, 15000);
</script>
</body>
